[pytest]
pythonpath = trading-agent
testpaths = trading-agent/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:coroutine 'AsyncMockMixin.*' was never awaited:RuntimeWarning
    ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning

