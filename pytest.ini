[pytest]
pythonpath = src .
testpaths = tests
addopts = --import-mode=importlib --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: marks pure deterministic unit tests without network or long I/O
    integration: marks multi-component integration or database tests
    live: marks tests that require live external market or macro data fetching
    network: marks tests that require an active external internet connection
    slow: marks tests that take more than 5 seconds to run



