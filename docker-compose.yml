version: '3.8'

networks:
  monika-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    container_name: monika-db
    restart: unless-stopped
    networks:
      - monika-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monika_trading}
      POSTGRES_USER: ${POSTGRES_USER:-monika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_docker_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-monika} -d $${POSTGRES_DB:-monika_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  trading-agent:
    build: .
    container_name: monika-core
    restart: unless-stopped
    networks:
      - monika-net
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./trading-agent/database:/app/trading-agent/database
      - ./trading-agent/logs:/app/trading-agent/logs
      - ./trading-agent/config/settings.yaml:/app/trading-agent/config/settings.yaml
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/trading-agent
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-monika}:${POSTGRES_PASSWORD:-changeme_docker_secure_password}@db:5432/${POSTGRES_DB:-monika_trading}
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    deploy:
      resources:
        limits:
          memory: 2G
