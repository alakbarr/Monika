[project]
name = "monika-trading-agent"
version = "1.0.0"
description = "Monika: Autonomous SOTA MT5 Trading Agent Harness"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Saiful Akbar", email = "asaifulakbarw@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    # Core & Architecture
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "arch>=7.0.0",
    "ta>=0.11.0",
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.10b0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    "psycopg[pool]>=3.1.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "ruamel.yaml>=0.17.0",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.8.2",
    "psutil>=5.9.0",
    "redis>=5.0.0",
    "rich>=13.0.0",
    "textual>=0.86.0",
    "prompt-toolkit>=3.0.0",
    "python-telegram-bot>=21.1.1",
    "certifi>=2024.2.2",
    "jsonschema>=4.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "concurrent-log-handler>=0.9.25",
    "bottleneck>=1.3.7",
    "hmmlearn>=0.3.2",
    # LLM & Graph
    "anthropic>=0.30.0",
    "typesafe-sdk>=0.6.0",
    "langgraph>=0.0.25",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.1.0",
    "llmlingua>=0.2.2",
    "openai>=1.14.0",
    # Data Acquisition & Scraping
    "DrissionPage>=4.0.0",
    "yfinance>=0.2.40",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "requests>=2.31.0",
    "gspread>=6.2.0",
    "google-auth>=2.30.0",
    # Platform execution
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "rpyc>=5.3.0; sys_platform != 'win32'",
    "uvloop>=0.20.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-subtests",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.1.0",
    "ruff",
    "pyright",
]
timesfm = [
    "torch>=2.14.0",
    "timesfm>=3.0.1",
    "huggingface_hub>=0.28.0",
    "safetensors>=0.5.3",
]
doc = [
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.5",
    "pyarrow>=15.0.0",
    "plotly>=5.20.0",
    "pypdf>=4.0.0",
    "Pillow>=10.3.0",
    "reportlab>=4.2.0",
    "weasyprint>=62.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monika = ["**/*.md", "**/*.yaml", "**/*.json", "**/*.mq5", "**/*.mako"]

[project.scripts]
monika = "monika.interfaces.cli.main:main"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    ".git",
    "venv",
    ".venv",
    "node_modules",
    "data",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "ASYNC251",
    "B002",
    "B003",
    "B004",
    "B005",
    "B006",
    "B008",
    "B011",
    "B012",
    "B013",
    "B014",
    "B015",
    "B016",
    "B017",
    "B018",
    "B019",
    "B020",
    "B021",
    "B022",
    "B024",
    "B025",
    "B026",
    "B028",
    "B029",
    "B030",
    "B031",
    "B032",
    "B033",
    "B034",
    "B035",
    "B039",
]
