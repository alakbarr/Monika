name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint
        run: |
          ruff check .

  python-test:
    name: Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading-agent/requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: trading-agent
        run: |
          python -m pytest trading-agent/tests -v

  frontend-build:
    name: Dashboard Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-agent/logging_observability/dashboard/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: trading-agent/logging_observability/dashboard/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install

      - name: Build Frontend
        run: |
          npm run build
