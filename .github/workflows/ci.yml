name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint & Code Standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff import-linter
          pip install -e .

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Import Linter (Architecture Contracts)
        env:
          PYTHONPATH: src
        run: |
          lint-imports

      - name: Verify Documentation Synchronization
        run: |
          python scripts/update_index_toc.py --check

  python-typecheck:
    name: Type Analysis (Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Pyright
        run: |
          npx --yes pyright

  python-test:
    name: Test Suite (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: market_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Setup Configuration from Template
        run: |
          cp config/settings.example.yaml config/settings.yaml

      - name: Apply Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/market_intelligence
        run: |
          alembic upgrade head

      - name: Run Pytest
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/market_intelligence
        run: |
          python -m pytest tests -v -m "not live and not network"

  frontend-build:
    name: Dashboard Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build Frontend
        run: |
          npm run build
