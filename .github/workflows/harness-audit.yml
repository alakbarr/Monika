name: Harness Audit

on:
  schedule:
    # Weekly baseline: Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      strict:
        description: Fail the job when a harness invariant fails
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-audit
  cancel-in-progress: false

jobs:
  harness-audit:
    name: Hermetic Harness Audit & Offline Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Offline Eval Tests
        run: |
          python -m pytest tests/evals tests/benchmark -q

      - name: Run Harness Audit
        run: |
          if [ "${{ inputs.strict }}" = "true" ]; then
            python -m monika.interfaces.cli.harness_audit --json --output harness_audit.json --strict
          else
            python -m monika.interfaces.cli.harness_audit --json --output harness_audit.json
          fi

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-audit-report
          path: harness_audit.json
          if-no-files-found: warn
