scenario_tree:
  enabled: true
  ev_threshold: 1.3
  min_dominant_prob: 0.45
  branch_types:
  - bull
  - bear
  - chop
  persist_trees: true
context_compaction:
  enabled: true
  synthesis_threshold: 0.5
  emergency_threshold: 0.85
progressive_tools:
  enabled: true
  core_primitives_only: true
  enable_category_loading: true
gepa_evolution:
  enabled: true
  schedule_interval_days: 14
  trade_count_threshold: 40
  drawdown_breaker_pct: 5.0
  min_cooldown_days: 7
verification_engine:
  enabled: true
  strict_pre_trade_assertions: true
  post_execution_reconciliation: true
alpha_discovery:
  enabled: true
  interval_hours: 24.0
  lookback_days: 120
  is_window_days: 60
  oos_window_days: 20
  step_days: 20
  min_wfe: 0.6
  min_oos_sharpe: 0.5
  max_drawdown_limit: 20.0
strategy_synthesis:
  enabled: true
  interval_hours: 48.0
  min_sharpe: 1.5
  max_drawdown_pct: 10.0
  min_trades: 5
  walk_forward_enabled: true
  min_walk_forward_sharpe: 1.0
  min_walk_forward_efficiency: 0.4
news_classification:
  slice_schedule:
    interval_minutes: 120

ui:
  theme: "retro_vintage"
  steer_mode: "one-at-a-time"

mcp:
  enabled: true
  client:
    timeout_seconds: 15
    servers:
      # --- FREE / FREE-TIER MCP SERVERS (Enabled by default) ---
      sqlite_metrics:
        enabled: true
        transport: "stdio"
        command: "python"
        args: ["-m", "analysis.mcp.servers.sqlite_server"]
        description: "Read-only access to local checkpointer and trading metrics"

      local_market_fs:
        enabled: true
        transport: "stdio"
        command: "python"
        args: ["-m", "analysis.mcp.servers.filesystem_server"]
        description: "Sandboxed read-only access to playbooks and trading files"

      web_fetch:
        enabled: true
        transport: "stdio"
        command: "python"
        args: ["-m", "analysis.mcp.servers.fetch_server"]
        description: "Lightweight public web content text extractor"

      # --- PAID / PROPRIETARY MCP SERVERS (Ready-to-fill config blocks) ---
