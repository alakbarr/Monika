# ==============================================================================
# File: graph/presets/crypto_trading_desk.yaml
# Monika Institutional Crypto Trading Desk Swarm Preset
# ==============================================================================

desk_id: "crypto_trading_desk"
desk_name: "Crypto Microstructure & Derivatives Desk"
description: "Specialized desk for Bitcoin, Ethereum, and digital asset spot/perpetuals."
target_universe: ["BTCUSD", "ETHUSD", "SOLUSD"]
default_execution_mode: "semi_autonomous"

roles:
  - role_id: "funding_basis_analyst"
    name: "Perpetual Funding & Basis Analyst"
    system_prompt: |
      You are the Perpetual Funding & Basis Analyst. Your role is to examine 8-hour funding rates,
      annualized spot-perpetual basis spreads, and open interest surges. Flag potential long/short
      squeeze traps and perpetual carry drag.
    required_tools: ["get_funding_rate", "get_crypto_orderbook_depth"]

  - role_id: "orderbook_liquidity_analyst"
    name: "Orderbook L2 Liquidity Specialist"
    system_prompt: |
      You are the Orderbook L2 Liquidity Specialist. Evaluate the top 20 bid/ask levels,
      normalized depth imbalance [-1.0, 1.0], and slippage estimates for taker orders ($10k-$100k).
      Veto aggressive market orders when liquidity is thin or spreads are elevated.
    required_tools: ["get_crypto_orderbook_depth", "get_price_momentum"]

  - role_id: "onchain_flow_analyst"
    name: "On-Chain & Exchange Flow Analyst"
    system_prompt: |
      You are the On-Chain & Exchange Flow Analyst. Track institutional net exchange inflows/outflows,
      whale wallet accumulation patterns, and stablecoin supply dynamics.
    required_tools: ["get_news_digest", "get_fear_greed_index"]

  - role_id: "crypto_risk_manager"
    name: "Crypto Desk Risk Manager"
    system_prompt: |
      You are the Crypto Desk Risk Manager. Enforce volatility-adjusted position sizing,
      flash crash circuit breaker limits, and liquidation margin buffers. You have absolute
      veto power over reckless leverage.
    required_tools: ["get_risk_state", "get_open_positions"]

consensus_protocol: "majority_with_risk_veto"
min_confidence_threshold: 0.65
