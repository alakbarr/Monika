version: '3.8'

# ==============================================================================
# Production Docker Compose for Ubuntu / Linux VPS Deployment
# AI Trading Agent System (Headless / Decoupled Architecture)
# ==============================================================================

networks:
  monika-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  agent_logs:
    driver: local
  agent_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Database Service (PostgreSQL with Asyncpg support)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: monika-db
    restart: unless-stopped
    networks:
      - monika-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monika_trading}
      POSTGRES_USER: ${POSTGRES_USER:-monika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_vps_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound strictly to localhost for internal VPS access / security
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-monika} -d $${POSTGRES_DB:-monika_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Core AI Trading Agent Service
  # ----------------------------------------------------------------------------
  tradeagent:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monika-core
    restart: unless-stopped
    networks:
      - monika-net
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/trading-agent
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-monika}:${POSTGRES_PASSWORD:-changeme_vps_secure_password}@db:5432/${POSTGRES_DB:-monika_trading}
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    volumes:
      - ./config/settings.yaml:/app/trading-agent/config/settings.yaml
      - agent_logs:/app/trading-agent/logs
      - agent_data:/app/trading-agent/data
      - ../backups:/app/trading-agent/backups
    ports:
      # Dashboard API exposed on localhost (reverse proxy via Nginx / Caddy recommended)
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'
        reservations:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
